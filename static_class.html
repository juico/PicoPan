<html>

<head>
  <style>
    /* Container for the image, line, and box */
    .image-container {
            position: relative;
            display: inline-block;
            border: 1px solid black;
        }

        /* Style for the vertical line */
        .vertical-line {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background-color: rgba(255, 0, 0, 0.6);
            display: none; /* Initially hidden */
        }

        /* Style for the box */
        .plot-box {
            position: absolute;
            top: 0;
            left: 0;
            /* width: 100px; */
            height: 100%;
            border: 1px;
            border-color:  black;
            border-style: solid;
            background-color: rgba(255, 255, 255, 0.6);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            display: none; /* Initially hidden */
        }
    #fileList table  { border-collapse:collapse; margin-top:6px; font-family:monospace; }
    #fileList th, #fileList td { border:1px solid #888; padding:3px 6px; }
    #statusBar { margin-top:6px; font-family:monospace; }

  </style>
  <script>
    class CanvasApp {
  constructor() {
    this.column = 0;
    this.initialFrame = false;
    this.messageLength = 0;
    this.datasets = [];
    this.xIncrement = 0;
    this.yScale = 1;
    this.focusScale = 1;
    this.focusMax = Array(8).fill(0);
    this.connectionStateDiv=null;
    this.histogramCanvas = null;
    this.histogramContext = null;
    this.focusCanvas = null;
    this.focusContext = null;
    this.imageCanvas = null;
    this.imageContext = null;
    this.socket = null;
    this.gammaFactor = 0.5;
    this.pixel = null
    this.lastConnect=null;
    this.jpegdata = new  Uint8Array();
    this.jpegimage=null;
    this.verticalLine=null;
    this.plotBox=null;
        // Capture
    this.isCapturing = false;
    this.progressStartTime = null;
    this.totalLines = 0;
        // SHOW FILES
    this.statusBar     = null;
    this.actionButtons = [];      // wszystkie <input type=button>
    window.onload = () => this.initialize();
  }

  initialize() {
      this.histogramCanvas = document.getElementById("histogramCanvas");
      this.histogramContext = this.histogramCanvas.getContext("2d");
      this.focusCanvas = document.getElementById("focusCanvas");
      this.focusContext = this.focusCanvas.getContext("2d");
      this.connectionStateDiv= document.getElementById("connectionState");
      this.jpegimage=document.getElementById("imageJPEG");
      this.verticalLine = document.getElementById('verticalLine');
      this.plotBox = document.getElementById('plotBox');
      this.imageContainer = document.getElementById('imageContainer');
      this.statusBar     = document.getElementById("statusBar");
      this.actionButtons = [...document.querySelectorAll("input[type=button]")];


      this.setupWebSocket();
      this.setupControls();
      // Add a click event listener to the image
      ;
      this.imageContainer.addEventListener('click', (function(event) {


             // Get the bounding rectangle of the image
             const rect = this.jpegimage.getBoundingClientRect();

// Calculate the coordinates relative to the image
const x = event.clientX - rect.left;
// Position the vertical line at the clicked x coordinate
this.verticalLine.style.left = `${x}px`;
this.verticalLine.style.display = 'block'; // Make the line visible

// Position the info box 50 pixels to the right of the line
const boxOffset = 50; // Distance from the line
const boxWidth = 100; // Width of the info box
const imageWidth = rect.width; // Width of the image

// Calculate the box's left position
let boxLeft = x + boxOffset;


this.plotBox.style.left = `${boxLeft}px`;
this.plotBox.style.display = 'block'; // Make the box visible
this.moveStepper(8*x);


}).bind(this));
  }

  disableButtons(flag){ this.actionButtons.forEach(b=>b.disabled = flag); }

  setupControls() {
    const buttons = [
      { id: "btn_capture", command: 0 },
      { id: "btn_focus", command: 1 },
      { id: "btn_preview", command: 2 },
      { id: "btn_abort", command: 3 },
      { id: "btn_expose", command: 4 },
      { id: "btn_jpeg", command: 5 },
    ];

    buttons.forEach(({ id, command }) => {
      document.getElementById(id)?.addEventListener("click", () => {
        this.sendCommand(command);
        this.column = 0;
      });
    });
    document.getElementById("btn_list_files")
            .addEventListener("click", () => { this.socket.send("LIST"); });
  }

  deleteFile(filename) {
    if (confirm(`Are you sure you want to delete file ${filename}?`)) {
      this.socket.send("DEL:" + filename);
    }
  }

  setupWebSocket() {
    this.socket = new WebSocket("ws://192.168.4.1:81/");
    this.socket.binaryType = "arraybuffer";
    this.socket.addEventListener("open", (event) => this.handleSocketOpen(event));

    this.socket.addEventListener("message", (event) => this.handleSocketMessage(event));
    this.socket.addEventListener("error", (event) => this.handleSocketError(event));
    this.lastConnect=new Date();

}

  handleSocketOpen(event){
    this.connectionStateDiv.innerText="Connected";

}
  handleSocketMessage(event) {
    if (event.data instanceof ArrayBuffer) {
      const view = new DataView(event.data);
      let offset = 0;

      while (offset < event.data.byteLength) {
        const messageType = view.getUint16(offset, true);
        const messageLength = view.getUint16(offset + 2, true) - 4;
        offset += 4;

        switch (messageType) {
          case 1: // Image data
            this.handleImageData(event.data, offset, messageLength);
            break;
          case 2: // Focus data
            this.handleFocusData(event.data, offset, messageLength);
            break;
          case 3: // Histogram data
            this.handleHistogramData(event.data, offset, messageLength);
            break;
          case 5: //Handle jpeg data
            this.handleJPEGData(event.data,offset,messageLength);
            break;
        }

        offset += messageLength;
      }

    } else if (typeof event.data === "string") {
      const msg = event.data;
      if (msg.startsWith("LIST:")) {
        // Otrzymana lista plików: generuj tabelę
        const listContent = msg.substring(5);  // odetnij "LIST:"
        const lines = listContent.split("\n").filter(line => line.length);
        let html = "<table><tr><th>File</th><th>Size (bytes)</th><th>Actions</th></tr>";
        for (const line of lines) {
          const [name, size] = line.split(";");
          html += `<tr><td>${name}</td><td>${this.humanFileSize(parseInt(size))}</td>
                <td>
                    <a href="http://192.168.4.1:80/file/${name}" download>Download</a>
                    <button onclick="app.deleteFile('${name}')">DELETE</button>
                </td></tr>`;
        }
        html += "</table>";
        document.getElementById("fileList").innerHTML = html;
      } else if (msg.startsWith("DELETING:")) {
        const fn = msg.substring(9);
        this.statusBar.textContent = `Deleting ${fn}...`;
        this.disableButtons(true);
      } else if (msg.startsWith("DELETED:")) {
        const fn = msg.substring(8);
        this.statusBar.textContent = `Deleted ${fn}`;
        setTimeout(()=>{ this.statusBar.textContent=""; },1500);
        this.socket.send("LIST");
        this.disableButtons(false);
      } else if (msg.startsWith("ERROR:")) {
          alert(msg.substring(6));  // wyświetl komunikat błędu
      } else if (msg.startsWith("L:")) {
          const lineNum = parseInt(msg.substr(2));
          this.updateProgress(lineNum);
      } else if (msg === "PREVIEW_DONE") {
        this.disableButtons(false);
        this.statusBar.textContent = "Preview complete.";
        setTimeout(()=>{ this.statusBar.textContent = ""; }, 3000);
      } else {
        console.log(event.data);
      }
    }
  }
  humanFileSize(bytes, si=false) {
      const thresh = si ? 1000 : 1024;
      if (bytes < thresh) return bytes + ' B';
      const units = si
        ? ['kB','MB','GB','TB','PB']
        : ['KiB','MiB','GiB','TiB','PiB'];
      let u = -1;
      do {
          bytes /= thresh; ++u;
      } while (bytes >= thresh && u < units.length-1);
      return bytes.toFixed(1) + ' ' + units[u];
  }

  handleSocketError(evt) {
    this.connectionStateDiv.textContent = "Disconnected";
    const now = Date.now();
    if (now - this.lastConnect.getTime() > 1000) {
      this.setupWebSocket();              // pierwszy retry natychmiast
    } else {
      setTimeout(() => this.setupWebSocket(), 1000); // dalsze co sekundę
    }
  }
  handleImageData(data, offset, length) {
    const imageDataArray = new Uint8Array(data.slice(offset, offset + length));

    for (let i = 0; i < imageDataArray.length / 3; i++) {
      const row = (this.imageContext.canvas.height - i) * 4;

      this.pixel[row] = Math.pow(imageDataArray[3 * i] / 255, this.gammaFactor) * 255;
      this.pixel[row + 1] = Math.pow(imageDataArray[3 * i + 1] / 255, this.gammaFactor) * 255;
      this.pixel[row + 2] = Math.pow(imageDataArray[3 * i + 2] / 255, this.gammaFactor) * 255;
      this.pixel[row + 3] = 255;
    }

    this.imageContext.putImageData(this.image, this.column++, 0);
    if (this.column > this.imageCanvas.width) {
      this.column = 0;
    }
  }
  handleJPEGData(data,offset,length){
    var tmp = new Uint8Array(data.slice(offset,offset+length));

      this.jpegdata = new Uint8Array([...this.jpegdata,...tmp]);

    this.jpegimage.src=URL.createObjectURL(
  new Blob([this.jpegdata.buffer], { type: 'image/jpeg' } /* (1) */)
);

  }
  handleFocusData(data, offset, length) {
    const focusDataArray = new Float32Array(data.slice(offset, offset + length));
    if (!this.initialFrame) {
      this.updateFocus(focusDataArray);
    } else {
      this.initialFrame = false;
    }
  }

  handleHistogramData(data, offset, length) {
    this.xIncrement = this.histogramCanvas.width / (length / 6 - 1);
    this.datasets = [];
    const RGB = ["255,0,0", "0,255,0", "0,0,255"];

    for (let i = 0; i < 3; i++) {
      const dataArray = new Uint16Array(data.slice(offset + i * (length / 3), offset + (i + 1) * (length / 3)));
      const fillColor = `rgba(${RGB[i]}, 0.5)`;
      const lineColor = `rgb(${RGB[i]})`;
      this.datasets.push({ data: dataArray, fillColor, lineColor });
    }

    this.updateHistogram(this.datasets.map((dataset) => dataset.data));
  }

  updateFocus(focusData) {
    this.focusContext.clearRect(0, 0, this.focusCanvas.width, this.focusCanvas.height);
    const barWidth = this.focusCanvas.height / focusData.length;

    if (Math.max(...focusData) > Math.max(...this.focusMax)) {
      this.focusScale = this.focusCanvas.width / Math.max(...focusData);
    }

    focusData.reverse().forEach((value, i) => {
      this.focusContext.fillStyle = "#ff0000";
      this.focusContext.fillRect(0, barWidth * i, this.focusMax[i] * this.focusScale, barWidth);
      this.focusContext.fillStyle = "#00ff00";
      this.focusContext.fillRect(0, barWidth * i, value * this.focusScale, barWidth);

      if (value > this.focusMax[i]) {
        this.focusMax[i] = value;
      }
    });
  }

  updateHistogram(newDataArray) {
    this.histogramContext.clearRect(0, 0, this.histogramCanvas.width, this.histogramCanvas.height);
    const maxDataValue =  newDataArray.reduce((max, data) => Math.max(max, Math.max(...data)), -Infinity);
    this.yScale = this.histogramCanvas.height / (maxDataValue * 1.1);

    this.datasets.forEach((dataset) => {
      this.histogramContext.fillStyle = dataset.fillColor;
      this.histogramContext.beginPath();
      this.histogramContext.moveTo(0, this.histogramCanvas.height);
      this.histogramContext.lineTo(0, this.histogramCanvas.height - dataset.data[0] * this.yScale);

      dataset.data.forEach((value, j) => {
        this.histogramContext.lineTo(j * this.xIncrement, this.histogramCanvas.height - value * this.yScale);
      });

      this.histogramContext.lineTo(this.histogramCanvas.width, this.histogramCanvas.height);
      this.histogramContext.closePath();
      this.histogramContext.fill();
    });

    this.datasets.forEach((dataset) => {
      this.histogramContext.beginPath();
      this.histogramContext.moveTo(0, this.histogramCanvas.height - dataset.data[0] * this.yScale);

      dataset.data.forEach((value, j) => {
        this.histogramContext.lineTo(j * this.xIncrement, this.histogramCanvas.height - value * this.yScale);
      });

      this.histogramContext.strokeStyle = dataset.lineColor;
      this.histogramContext.stroke();
    });
  }
  
  updateProgress(lineNum) {
      if (!this.isCapturing) return;  // ignoruj, jeśli nie w trybie skanowania
      const now = Date.now();
      // Ustaw czas startu przy pierwszym pomiarze
      if (!this.progressStartTime) {
          this.progressStartTime = now;
      }
      // Oblicz procent ukończenia
      const percent = Math.floor((lineNum / this.totalLines) * 100);
      // Oblicz średni czas na linię i estymowany czas do końca
      const elapsedMs = now - this.progressStartTime;
      let remainingMs = 0;
      if (lineNum > 0) {
          const avgTimePerLine = elapsedMs / lineNum;
          remainingMs = (this.totalLines - lineNum) * avgTimePerLine;
      }
      let remainingSec = Math.max(0, Math.round(remainingMs / 1000));
      // Sformatuj pozostały czas jako h:m:s
      const remH = Math.floor(remainingSec / 3600);
      remainingSec %= 3600;
      const remM = Math.floor(remainingSec / 60);
      const remS = remainingSec % 60;
      let remainingStr = "";
      if (remH > 0) {
          remainingStr = `${remH}h ${remM}m ${remS}s`;
      } else if (remM > 0) {
          remainingStr = `${remM}m ${remS}s`;
      } else {
          remainingStr = `${remS}s`;
      }
      // Oblicz orientacyjny czas zakończenia (godzina)
      let finishStr = "";
      if (lineNum > 0 && remainingMs > 0) {
          const finishTime = new Date(now + remainingMs);
          const hh = finishTime.getHours().toString().padStart(2, '0');
          const mm = finishTime.getMinutes().toString().padStart(2, '0');
          const ss = finishTime.getSeconds().toString().padStart(2, '0');
          finishStr = `${hh}:${mm}:${ss}`;
      }
      // Zaktualizuj pasek postępu i tekst statusu
      const progElem = document.getElementById('progressBar');
      if (progElem) {
          progElem.value = lineNum;
          progElem.max = this.totalLines;
      }
      this.statusBar.innerHTML = 
          `Progress: <progress id="progressBar" value="${lineNum}" max="${this.totalLines}"></progress> ` +
          `${percent}% (${lineNum}/${this.totalLines}) - Est. remaining: <b>${remainingStr}</b>` +
          (finishStr ? ` - Finish at ${finishStr}` : "");
      // Jeśli osiągnięto końcową linię, wyświetl komunikat o zakończeniu
      if (lineNum >= this.totalLines) {
          this.isCapturing = false;
          const totalTimeMs = now - this.progressStartTime;
          const totalSec = Math.round(totalTimeMs / 1000);
          const totalMin = Math.floor(totalSec / 60);
          const totalSecRemain = totalSec % 60;
          let totalTimeStr = (totalMin > 0 ? `${totalMin}m ` : "") + `${totalSecRemain}s`;
          this.statusBar.textContent = `Capture complete (${lineNum} lines, ${totalTimeStr})`;
          // Odblokuj przyciski - skanowanie zakończone
          this.disableButtons(false);
      }
  }

  sendCommand(command) {
    this.initialFrame = true;

    const commandBuffer = new ArrayBuffer(18);
    const commandView = new DataView(commandBuffer);
    const cmdForm = document.getElementById("command_form");
    
    // schowaj listę plików, jeżeli była widoczna
    document.getElementById("fileList").innerHTML = "";

    if (command === 0) {
      // Rozpoczęto skanowanie: ustaw stan i zainicjuj licznik
      this.isCapturing = true;
      this.progressStartTime = null;
      this.totalLines = parseInt(cmdForm.lines.value) || 0;
      // Ukryj ewentualne nakładki (podgląd, focus, histogram)
      this.verticalLine.style.display = 'none';
      this.focusCanvas.style.display = 'none';
      this.histogramCanvas.style.display = 'none';
      this.plotBox.style.display = 'none';
      // Wyłącz wszystkie przyciski (poza Abort) na czas skanowania
      this.disableButtons(true);
      document.getElementById("btn_abort").disabled = false;
      // Pokaż pasek postępu (0% na start)
      this.statusBar.innerHTML = 
          `Progress: <progress id="progressBar" value="0" max="${this.totalLines}"></progress> ` +
          `0% (0/${this.totalLines}) - Est. remaining: calculating...`;
    }
    if (command === 1) {  // FOCUS
      this.focusCanvas.style.display = 'block';
      this.histogramCanvas.style.display = 'none';
      this.focusMax = Array(8).fill(0);
    }
    if (command === 4) {  // EXPOSE (histogram)
        this.focusCanvas.style.display = 'none';
        this.histogramCanvas.style.display = 'block';
    }
    if(command === 2){ //clear image when starting new preview
      this.isCapturing = false;
      this.disableButtons(true);
      document.getElementById("btn_abort").disabled = false;
      this.statusBar.textContent = "Preview running...";
      this.jpegdata=new Uint8Array();
      this.verticalLine.style.display = 'none'; // Make the line visible
      this.focusCanvas.style.display='none';
      this.histogramCanvas.style.display='none';
      this.plotBox.style.display = 'none';
    }
    if(command === 2){//show focus plot when focus command is send
      this.focusCanvas.style.display='block';
      this.histogramCanvas.style.display='none';
      this.focusMax=Array(8).fill(0);
    }
    if (command === 3) {
        // Jeśli przerywamy trwający skan, zresetuj pasek postępu
        if (this.isCapturing) {
            this.isCapturing = false;
            this.statusBar.textContent = "Capture aborted.";
            // (Opcjonalnie wyczyść komunikat po 5s)
            setTimeout(() => {
                if (this.statusBar.textContent.startsWith("Capture aborted")) {
                    this.statusBar.textContent = "";
                }
            }, 5000);
        }
        // Odblokuj wszystkie przyciski po przerwaniu
        this.disableButtons(false);
    }

    commandView.setUint16(0, 1337, true);
    commandView.setUint8(2, command);
    commandView.setUint16(3, cmdForm.exp_time.value, true);
    commandView.setUint8(5, cmdForm.resolution.value);
    commandView.setUint8(6, cmdForm.gain.value);
    commandView.setUint32(7, cmdForm.lines.value, true);
    commandView.setUint16(11, cmdForm.steps_line.value, true);
    commandView.setUint16(13, cmdForm.crop_start.value, true);
    commandView.setUint16(15, cmdForm.crop_end.value, true);
    commandView.setUint8(17, cmdForm.preview_avg.value);
    this.socket.send(commandView.buffer);
  }
  moveStepper(position){

    const commandBuffer = new ArrayBuffer(18);
    const commandView = new DataView(commandBuffer);
    const cmdForm = document.getElementById("command_form");

    // this.imageCanvas.width = Math.floor(cmdForm.lines.value / 8);
    // this.column = 0;

    commandView.setUint16(0, 1337, true);
    commandView.setUint8(2, 6);
    commandView.setUint16(3, cmdForm.exp_time.value, true);
    commandView.setUint8(5, cmdForm.resolution.value);
    commandView.setUint8(6, cmdForm.gain.value);
    commandView.setUint32(7, position, true);
    commandView.setUint16(11, cmdForm.steps_line.value, true);
    commandView.setUint16(13, cmdForm.crop_start.value, true);
    commandView.setUint16(15, cmdForm.crop_end.value, true);
    commandView.setUint8(17, cmdForm.preview_avg.value);

    this.socket.send(commandView.buffer);
  }
}

// Instantiate the class
window.app = new CanvasApp();

  </script>

</head>

<body>
    <div id="connectionState" ></div>
    <div id="imageContainer" class="image-container">
      <img id="imageJPEG" />
              <!-- Vertical line -->
              <div id="verticalLine" class="vertical-line"></div>
              <div id="plotBox" class="plot-box">
                <canvas  id="focusCanvas" width="500" height="592" style=""></canvas>
                <canvas  id="histogramCanvas" width="512" height="300" style=""></canvas>
                <!-- <canvas  id="focusCanvas" width="500" height="100%" style="border-style: dotted;border-width: 2px;"></canvas>
                <canvas  id="histogramCanvas" width="512" height="100%" style="border-style: dotted;border-width: 2px;"></canvas> -->
              </div>

    </div>

  <div>

    <form id="command_form">
      <label for="exp_time">Exposure time[1/s]:</label>

      <input value="50" name="exp_time" type="number">
      <br>
      <label for="resolution">Resolution:</label>
      <input name="resolution" type="number">
      <br>
      <label for="gain">Gain:</label><input value="0" name="gain" type="number"><br>
      <label for="lines">Lines:</label><input name="lines" type="number" value="10820"><br>
      <label for="steps_line">Steps per 100 lines:</label><input value="600" name="steps_line" type="number"><br>


      <label for="crop_start">Crop start:</label><input name="crop_start" type="number"><br>
      <label for="crop_end">Crop end:</label><input name="crop_end" type="number"><br>
      <label for="preview_avg">Preview avarage:</label><input name="preview_avg" type="number"><br>
      <input type="button" id="btn_capture" value="capture">
      <input type="button" id="btn_focus" value="focus">
      <input type="button" id="btn_preview" value="preview">
      <input type="button" id="btn_abort" value="abort">
      <input type="button" id="btn_expose" value="expose">
      <input type="button" id="btn_jpeg" value="jpeg preview">
      <input type="button" id="btn_list_files" value="Show Files">

    </form>

    <div id="fileList"></div>
    <div id="statusBar"></div>
  </div>
</body>

</html>
